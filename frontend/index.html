<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitFix - Git Error Explainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>GitFix</h1>
            <p>Understand your Git errors and know what to do next.</p>
        </header>

        <section class="card">
            <label for="gitError">Paste your Git error</label>

            <textarea
                id="gitError"
                placeholder="Example: fatal: not a git repository..."
            ></textarea>

            <button id="explainBtn">
                Explain Error
            </button>

            <p id="errorMessage"></p>
        </section>

        <section id="result" class="card result hidden">
            <h2>Explanation</h2>
            <div id="explanation"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
